[project]
name = "app"
version = "0.1.0"
description = "Digitizing healthcare documents sent by email or API endpoint"
readme = "README.md"
authors = [
    { name = "devprad-ml", email = "p.motadoo@gmail.com" }
]


requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.1",
    "psycopg2>=2.9.13",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]


[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
src = ["src", "tests"]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  
    "F",
    "I",
    # "UP" # pyupgrade to Python version in venv.
    # "B", # flake8 bugbear to catch common structural bugs and pitfalls
]


[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
]


[tool.pytest.ini_options]
testpaths = ["tests"]

name: CI

on:
    push:
        branches:
            - main
    pull_request:

jobs:
    ci:
        runs-on: ubuntu-latest
        services:
          postgres:
            image: postgres:16
            env:
              POSTGRES_USER: postgres
              POSTGRES_PASSWORD: postgrespassword
              POSTGRES_DB: app_db

        steps:
            - name: Check out repository
              uses: actions/checkout@v4
            
            - name: Set up uv
              uses: astral-sh/setup-uv@v6
              with:
                enable-cache: true
            
            - name: Install dependencies
              run: uv sync
            
            - name: Lint code with Ruff
              run: uv run ruff check
            
            - name: Check formatting with Ruff
              run: uv run ruff format --check
            
            - name: Run test suite
              env:
                DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@localhost:5432/app_db
                ANTHROPIC_API_KEY: some_anthropic_key
                DOWNSTREAM_BASE_URL: http://downstream.valid
              run: uv run pytest



  

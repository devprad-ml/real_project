name: CI

on:
    push:
        branches:
            - main
    pull_request:

jobs:
    ci:
        runs-on: ubuntu-latest
        services:
          postgres:
            image: postgres:16
            env:
              POSTGRES_USER: postgres
              POSTGRES_PASSWORD: postgrespassword
              POSTGRES_DB: app_db
            ports:
              - 5432:5432
            options: >-
              --health-cmd pg_isready
              --health-interval 5s
              --health-timeout 5s
              --health-retries 10

        steps:
            - name: Check out repository
              uses: actions/checkout@v4
            
            - name: Set up uv
              uses: astral-sh/setup-uv@v6
              with:
                enable-cache: true
            
            - name: Install dependencies
              run: uv sync
            
            - name: Apply migrations
              env:
                DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@localhost:5432/app_db
                ANTHROPIC_API_KEY: some_anthropic_key
                DOWNSTREAM_BASE_URL: http://downstream.valid
              run: uv run alembic upgrade head

            - name: Run test suite
              env:
                DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@localhost:5432/app_db
                # The restricted role the app actually runs as, created by migration
                # 3f4b8b1e99a0. Without it the privilege tests skip, and the grant
                # model goes untested -- CI is otherwise a superuser.
                APP_USER_DATABASE_URL: postgresql+psycopg2://app_user:password2@localhost:5432/app_db
                ANTHROPIC_API_KEY: some_anthropic_key
                DOWNSTREAM_BASE_URL: http://downstream.valid
              run: uv run pytest



  

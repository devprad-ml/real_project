<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingested Documents</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --muted:#5d6670; --line:#d9dde3;
          --accent:#2457c5; --warn:#a4460b; --ok:#1d7a3e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121417; --card:#1c1f24; --ink:#e7e9ec; --muted:#9aa3ad; --line:#30353c;
            --accent:#7aa2ff; --warn:#f0a35e; --ok:#5fcf8a; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display:flex; gap:8px; align-items:center; flex-wrap:wrap;
           padding:12px 16px; border-bottom:1px solid var(--line); background:var(--card); }
  h1 { font-size:17px; margin:0 auto 0 0; }
  input, button { font:inherit; color:inherit; background:var(--bg);
                  border:1px solid var(--line); border-radius:6px; padding:6px 8px; }
  button { cursor:pointer; background:var(--accent); color:#fff; border-color:var(--accent); }
  a { color:var(--accent); }
  main { padding:16px; }
  #msg { color:var(--muted); min-height:1.4em; margin:0 0 10px; }
  #msg.bad { color:var(--warn); }
  .wrap { overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:6px; }
  table { border-collapse:collapse; width:100%; }
  th, td { padding:8px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
  th { font-size:13px; color:var(--muted); font-weight:600; white-space:nowrap; }
  tr:last-child td { border-bottom:0; }
  td.time { white-space:nowrap; font-variant-numeric:tabular-nums; }
  .ready { color:var(--ok); } .failed { color:var(--warn); } .processing { color:var(--muted); }
  .sub { display:block; color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>Ingested documents</h1>
  <a href="/chat">Chat</a>
  <label for="key" hidden>API key</label>
  <input id="key" type="password" placeholder="API key (dk_...)" size="28" autocomplete="off">
  <button id="load">Load</button>
</header>
<main>
  <p id="msg" role="status">Paste an API key and load.</p>
  <div class="wrap" id="wrap" hidden>
    <table>
      <thead><tr>
        <th>Document</th><th>Type</th><th>State</th><th>From</th>
        <th>Email sent</th><th>Ingested</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>
<script>
const $ = (s) => document.querySelector(s);
const REFRESH_MS = 15000;
let timer = null;

const cell = (text, cls) => {
  const td = document.createElement("td");
  td.textContent = text ?? "";
  if (cls) td.className = cls;
  return td;
};
const when = (iso) => iso ? new Date(iso).toLocaleString() : "unknown";
// Naive UTC from Postgres: without the Z the browser would read it as local time.
const whenUtc = (iso) => when(/[zZ]|[+-]\d\d:\d\d$/.test(iso) ? iso : iso + "Z");

function render(items) {
  const rows = items.map((d) => {
    const tr = document.createElement("tr");
    const name = cell(d.filename || d.id);
    if (d.pages) {
      const pages = document.createElement("span");
      pages.className = "sub";
      pages.textContent = `${d.pages} page${d.pages === 1 ? "" : "s"}`;
      name.append(pages);
    }
    const from = cell(d.sender || "unknown");
    if (d.subject) {
      const subject = document.createElement("span");
      subject.className = "sub";
      subject.textContent = d.subject;
      from.append(subject);
    }
    tr.append(name, cell(d.doc_type.replace("_", " ")), cell(d.state, d.state), from,
              cell(when(d.sent_at), "time"), cell(whenUtc(d.received_at), "time"));
    return tr;
  });
  $("#rows").replaceChildren(...rows);
  $("#wrap").hidden = items.length === 0;
}

async function load() {
  clearTimeout(timer);
  const msg = $("#msg");
  const key = $("#key").value.trim();
  if (!key) { msg.className = "bad"; msg.textContent = "Paste an API key first."; return; }
  try {
    const r = await fetch("/intake", { headers: { Authorization: `Bearer ${key}` } });
    if (r.status === 401 || r.status === 403) throw new Error("Check your API key.");
    if (!r.ok) throw new Error(`The server answered ${r.status}.`);
    const items = await r.json();
    render(items);
    msg.className = "";
    msg.textContent = items.length
      ? `${items.length} document${items.length === 1 ? "" : "s"}, updated ${new Date().toLocaleTimeString()}`
      : "Nothing ingested yet. Documents appear here after they are emailed in.";
    timer = setTimeout(load, REFRESH_MS);
  } catch (e) {
    msg.className = "bad";
    msg.textContent = e.message;
  }
}
$("#load").addEventListener("click", load);
$("#key").addEventListener("keydown", (e) => { if (e.key === "Enter") load(); });
</script>
</body>
</html>

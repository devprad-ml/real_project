services:
    postgres:
        image: postgres:16
        container_name: postgres_db
        restart: unless-stopped
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: newpassword
            POSTGRES_DB: app_db
        ports: 
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 10s

    qdrant:
        image: qdrant/qdrant:latest
        container_name: qdrant
        restart: unless-stopped
        ports:
            - "6333:6333"   # REST, what qdrant-client uses by default
            - "6334:6334"   # gRPC, faster for bulk upserts if you switch later
        volumes:
            - qdrant_data:/qdrant/storage

volumes:
    postgres_data:
    qdrant_data: